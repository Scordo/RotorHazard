name: rotorhazard-dev

services:
  rotorhazard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    image: rotorhazard:dev
    container_name: rotorhazard-dev
    ports:
      - "5000:5000"
      - "127.0.0.1:5678:5678"       # debugpy (localhost only)
    volumes:
      - ..:/app                      # source code
      - rh-dev-data:/data
      - /dev:/dev                    # USB nodes incl. hotplug
      - /run/udev:/run/udev:ro       # by-id names / udev info for pyserial
    device_cgroup_rules:
      - "c 188:* rmw"                # ttyUSB* (CH340, CP210x, FTDI)
      - "c 166:* rmw"                # ttyACM* (CDC-ACM, e.g. STM32/Arduino native USB)
    environment:
      - TZ=${TZ:-Etc/UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - RH_EXTRA_GIDS=${RH_EXTRA_GIDS:-}
      - RH_MOCK_NODES=${RH_MOCK_NODES:-}   # empty = off

volumes:
  rh-dev-data:
